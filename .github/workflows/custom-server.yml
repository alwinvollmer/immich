# Fork-only: builds the immich-server image (server + web) from the `custom`
# branch and pushes it to ghcr.io/<owner>/immich-server. Upstream's docker.yml
# (multi-arch, reusable devtools workflows) is not used in this fork.
name: Custom server image

on:
  push:
    branches: [custom]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: custom-server
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The fork carries no upstream tags; server/package.json holds the release version.
      - name: Compute tags
        id: meta
        run: |
          base=v$(jq -r .version server/package.json)
          echo "version=${base}-custom-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/immich-server" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:custom
          build-args: |
            BUILD_ID=${{ github.run_id }}
            BUILD_IMAGE=${{ steps.meta.outputs.version }}
            BUILD_SOURCE_REF=${{ github.ref_name }}
            BUILD_SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
